# Copy to a root-owned file outside the repository and set
# JOBHUNT_APPLICATION_ANSWERS_FILE to its path. On AWS the populated value is
# stored as an SSM SecureString and restored to /etc/jobhunt/application_answers.yaml.
version: 1
identity:
  date_of_birth: null
  pronouns: null
  gender: null
  race_ethnicity: null
  veteran: null
  disability:
    current: null
    history: null
education:
  high_school: null
  high_school_graduation_year: null
  expected_graduation_month: null
  expected_graduation_year: null
  # An explicitly approved estimate is allowed when a form requires a day.
  exact_graduation_date: null
preferences:
  hybrid: null
  relocation_assistance_required: null
  travel: null
  future_contact: null
  compensation_policy: null
availability:
  summer_2027:
    pursue: true
    start: null
    end: null
  fall_2026:
    pursue: false
    start: null
    end: null
  spring_2027:
    pursue: false
    start: null
    end: null
current_offers:
  # deadline_month supports truthful month-only answers. Keep deadline null until
  # the exact contractual date is verified; day-level fields will remain manual.
  - company: null
    deadline_month: null
    deadline: null
legal:
  non_compete_or_conflict: null
  notice_period: null
  valid_drivers_license: null
  security_clearance: null
professional:
  # Use false or [] only after the user confirms there are no publications.
  publications: null
# Exact user-authored answers for recurring free-text application prompts. Every
# normalized phrase in match_all must appear in the form question before the
# answer is eligible. Keep the real populated values in the encrypted answer bank.
long_form_answers:
  - key: example_accomplishment
    match_all:
      - "most impressive thing"
      - "built or achieved"
    answer: null
company_facts:
  Example Company:
    used_product: null
    prior_employment: null
    referral: null
    prior_interview: null
    prior_application: null
    prior_interview_or_application: null
    finra_registered: null
    finra_licenses: null
    securities_exam_planned: null
    licenses_or_exams: null
    household_employment: null
    # Exact labels selected from employer forms. Keep these company-scoped so a
    # recruiting source or employment preference is never inferred elsewhere.
    recruiting_source: null
    employment_type: null
    # Company-specific hometown prompts may split city, region, and country into
    # separate controls. Populate only from an explicit user answer.
    hometown:
      city: null
      region: null
      country: null
    # Use only for a company/location whose fully-onsite requirement was approved.
    fully_onsite: null
