# Copy to a root-owned file outside the repository and set
# JOBHUNT_APPLICATION_ANSWERS_FILE to its path. On AWS the populated value is
# stored as an SSM SecureString and restored to /etc/jobhunt/application_answers.yaml.
version: 1
identity:
  date_of_birth: null
  pronouns: null
  gender: null
  race_ethnicity: null
  veteran: null
  disability:
    current: null
    history: null
education:
  high_school: null
  high_school_graduation_year: null
  standardized_tests:
    sat: null
    act: null
    # Set false only after the user confirms they did not take the ACT.
    act_taken: null
  expected_graduation_month: null
  expected_graduation_year: null
  # An explicitly approved estimate is allowed when a form requires a day.
  exact_graduation_date: null
preferences:
  hybrid: null
  # General willingness facts. These do not claim the candidate is currently
  # within commuting distance of any particular office.
  onsite: null
  relocate: null
  # Ordered generic answers explicitly approved for recruiting-source questions.
  # A company-specific recruiting_source still takes precedence.
  recruiting_sources: []
  relocation_assistance_required: null
  travel: null
  future_contact: null
  compensation_policy: null
availability:
  # Exact candidate-specific dates belong only in the private runtime file.
  default_start_date: null
  summer_2027:
    pursue: true
    start: null
    end: null
  fall_2026:
    pursue: false
    start: null
    end: null
  spring_2027:
    pursue: false
    start: null
    end: null
current_offers:
  # Keep populated offer details only in the private runtime file.
  - company: null
    description: null
    deadline_month: null
    deadline: null
    deadline_note: null
legal:
  non_compete_or_conflict: null
  notice_period: null
  valid_drivers_license: null
  security_clearance: null
  us_dod_employment_after_2008_01_28: null
  self_or_family_or_business_partner_government_employment: null
  political_contributions_over_150_last_two_years: null
professional:
  english_proficiency: null
  # Use false or [] only after the user confirms there are no publications.
  publications: null
  # Exact response for direct reference-detail fields, for example
  # "Available upon request." Never store invented names or contact details.
  references: null
documents:
  unofficial_transcript:
    available: null
    application_upload_authorized: null
events:
  example_event:
    attending: null
# Exact user-authored answers for recurring free-text application prompts. Every
# normalized phrase in match_all must appear in the form question before the
# answer is eligible. Keep the real populated values in the encrypted answer bank.
long_form_answers:
  - key: example_accomplishment
    # Optional employer guard for answers researched or authored for one company.
    company: null
    # Optional exact ATS board tokens that identify the same employer.
    company_aliases: []
    match_all:
      - "most impressive thing"
      - "built or achieved"
    answer: null
company_facts:
  Example Company:
    used_product: null
    prior_employment: null
    referral: null
    prior_interview: null
    prior_application: null
    prior_interview_or_application: null
    finra_registered: null
    finra_licenses: null
    securities_exam_planned: null
    licenses_or_exams: null
    household_employment: null
    # Exact labels selected from employer forms. Keep these company-scoped so a
    # recruiting source or employment preference is never inferred elsewhere.
    recruiting_source: null
    employment_type: null
    # Company-specific hometown prompts may split city, region, and country into
    # separate controls. Populate only from an explicit user answer.
    hometown:
      city: null
      region: null
      country: null
    # Use only for a company/location whose fully-onsite requirement was approved.
    fully_onsite: null
